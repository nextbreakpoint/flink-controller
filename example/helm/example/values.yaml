# Default values.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

s3BucketName: nextbreakpoint-example
s3Endpoint: http://minio-headless.minio:9000
s3PathStyleAccess: "true"
s3AccessKey: minioaccesskey
s3SecretKey: miniosecretkey

flinkVersion: "1.20.0"

runtime:
  pullPolicy: IfNotPresent
  image: apache/flink:1.20.0-scala_2.12-java11

supervisor:
  pullPolicy: IfNotPresent
  rescalePolicy: JobParallelism
  rescaleDelay: 10
  taskTimeout: 180
  pollingInterval: 5
  replicas: 1

jobManager:
  serviceMode: ClusterIP

taskManager:
  taskSlots: 1

jobs:
  pullPolicy: IfNotPresent
  image: example/jobs:latest
  example:
    restartPolicy: Always
    savepointMode: Automatic
    savepointInterval: 600
    jobParallelism: 1
    restartDelay: 30
    restartTimeout: 120

taskManagers:
