{{- $name := include "flink-k8s-toolbox.name" . -}}
{{- $chart := include "flink-k8s-toolbox.chart" . -}}
{{- $root := . }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flinkjobs.nextbreakpoint.com
  labels:
    chart: {{ $chart }}
    release: {{ $root.Release.Name }}
    heritage: {{ $root.Release.Service }}
spec:
  group: nextbreakpoint.com
  scope: Namespaced
  names:
    plural: flinkjobs
    singular: flinkjob
    kind: FlinkJob
    shortNames:
    - fj
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: A Flink job specification.
              type: object
              nullable: false
              properties:
                jobParallelism:
                  description: Parallelism of the job. Default value is 0.
                  type: integer
                  nullable: true
                minJobParallelism:
                  description: The min parallelism of the job. Default value is 0.
                  type: integer
                  nullable: true
                maxJobParallelism:
                  description: The max parallelism of the job. Default value is 32.
                  type: integer
                  nullable: true
                bootstrap:
                  description: A Flink bootstrap specification.
                  type: object
                  nullable: false
                  properties:
                    pullSecrets:
                      description: Pull scretes to use for pulling from private registry.
                      type: string
                      nullable: true
                    pullPolicy:
                      description: Policy to use for pulling images. Default value is IfNotPresent.
                      type: string
                      nullable: true
                      enum:
                        - Never
                        - Always
                        - IfNotPresent
                    image:
                      description: Image to use for bootstrap job.
                      type: string
                      nullable: false
                    className:
                      description: Main class to execute.
                      type: string
                      nullable: false
                    jarPath:
                      description: Path of jar file.
                      type: string
                      nullable: false
                    arguments:
                      description: Arguments for job.
                      type: array
                      nullable: true
                      items:
                        type: string
                    serviceAccount:
                      description: Service account to use for running the bootstrap job.
                      type: string
                      nullable: true
                    resources:
                      description: "ResourceRequirements describes the compute resource requirements."
                      properties:
                        claims:
                          description: "Claims lists the names of resources, defined in spec.resourceClaims,\
                            \ that are used by this container.\n\nThis is an alpha field and requires enabling\
                            \ the DynamicResourceAllocation feature gate.\n\nThis field is immutable. It\
                            \ can only be set for containers."
                          items:
                            description: "ResourceClaim references one entry in PodSpec.ResourceClaims."
                            properties:
                              name:
                                description: "Name must match the name of one entry in pod.spec.resourceClaims\
                                  \ of the Pod where this field is used. It makes that resource available\
                                  \ inside a container."
                                type: "string"
                              request:
                                description: "Request is the name chosen for a request in the referenced\
                                  \ claim. If empty, everything from the claim is made available, otherwise\
                                  \ only the result of this request."
                                type: "string"
                            required:
                              - "name"
                            type: "object"
                          type: "array"
                          x-kubernetes-list-map-keys:
                            - "name"
                          x-kubernetes-list-type: "map"
                        limits:
                          additionalProperties:
                            description: "Quantity is a fixed-point representation of a number. It provides\
                              \ convenient marshaling/unmarshaling in JSON and YAML, in addition to String()\
                              \ and AsInt64() accessors.\n\nThe serialization format is:\n\n``` <quantity>\
                              \        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty,\
                              \ from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ...\
                              \ | 9 <digits>          ::= <digit> | <digit><digits> <number>          ::=\
                              \ <digits> | <digits>.<digits> | <digits>. | .<digits> <sign>            ::=\
                              \ \"+\" | \"-\" <signedNumber>    ::= <number> | <sign><number> <suffix> \
                              \         ::= <binarySI> | <decimalExponent> | <decimalSI> <binarySI>    \
                              \    ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units;\
                              \ See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>     \
                              \  ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000\
                              \ = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\"\
                              \ <signedNumber> | \"E\" <signedNumber> ```\n\nNo matter which of the three\
                              \ exponent forms is used, no quantity may represent a number greater than\
                              \ 2^63-1 in magnitude, nor may it have more than 3 decimal places. Numbers\
                              \ larger or more precise will be capped or rounded up. (E.g.: 0.1m will rounded\
                              \ up to 1m.) This may be extended in the future if we require larger or smaller\
                              \ quantities.\n\nWhen a Quantity is parsed from a string, it will remember\
                              \ the type of suffix it had, and will use the same type again when it is serialized.\n\
                              \nBefore serializing, Quantity will be put in \"canonical form\". This means\
                              \ that Exponent/suffix will be adjusted up or down (with a corresponding increase\
                              \ or decrease in Mantissa) such that:\n\n- No precision is lost - No fractional\
                              \ digits will be emitted - The exponent (or suffix) is as large as possible.\n\
                              \nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n\
                              - 1.5 will be serialized as \"1500m\" - 1.5Gi will be serialized as \"1536Mi\"\
                              \n\nNote that the quantity will NEVER be internally represented by a floating\
                              \ point number. That is the whole point of this exercise.\n\nNon-canonical\
                              \ values will still parse as long as they are well formed, but will be re-emitted\
                              \ in their canonical form. (So always use canonical form, or don't diff.)\n\
                              \nThis format is intended to make it difficult to use these numbers without\
                              \ writing some sort of special handling code in the hopes that that will cause\
                              \ implementors to also use a fixed point implementation."
                            type: "string"
                            properties: { }
                          description: "Limits describes the maximum amount of compute resources allowed.\
                            \ More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
                          type: "object"
                          properties: { }
                        requests:
                          additionalProperties:
                            description: "Quantity is a fixed-point representation of a number. It provides\
                              \ convenient marshaling/unmarshaling in JSON and YAML, in addition to String()\
                              \ and AsInt64() accessors.\n\nThe serialization format is:\n\n``` <quantity>\
                              \        ::= <signedNumber><suffix>\n\n\t(Note that <suffix> may be empty,\
                              \ from the \"\" case in <decimalSI>.)\n\n<digit>           ::= 0 | 1 | ...\
                              \ | 9 <digits>          ::= <digit> | <digit><digits> <number>          ::=\
                              \ <digits> | <digits>.<digits> | <digits>. | .<digits> <sign>            ::=\
                              \ \"+\" | \"-\" <signedNumber>    ::= <number> | <sign><number> <suffix> \
                              \         ::= <binarySI> | <decimalExponent> | <decimalSI> <binarySI>    \
                              \    ::= Ki | Mi | Gi | Ti | Pi | Ei\n\n\t(International System of units;\
                              \ See: http://physics.nist.gov/cuu/Units/binary.html)\n\n<decimalSI>     \
                              \  ::= m | \"\" | k | M | G | T | P | E\n\n\t(Note that 1024 = 1Ki but 1000\
                              \ = 1k; I didn't choose the capitalization.)\n\n<decimalExponent> ::= \"e\"\
                              \ <signedNumber> | \"E\" <signedNumber> ```\n\nNo matter which of the three\
                              \ exponent forms is used, no quantity may represent a number greater than\
                              \ 2^63-1 in magnitude, nor may it have more than 3 decimal places. Numbers\
                              \ larger or more precise will be capped or rounded up. (E.g.: 0.1m will rounded\
                              \ up to 1m.) This may be extended in the future if we require larger or smaller\
                              \ quantities.\n\nWhen a Quantity is parsed from a string, it will remember\
                              \ the type of suffix it had, and will use the same type again when it is serialized.\n\
                              \nBefore serializing, Quantity will be put in \"canonical form\". This means\
                              \ that Exponent/suffix will be adjusted up or down (with a corresponding increase\
                              \ or decrease in Mantissa) such that:\n\n- No precision is lost - No fractional\
                              \ digits will be emitted - The exponent (or suffix) is as large as possible.\n\
                              \nThe sign will be omitted unless the number is negative.\n\nExamples:\n\n\
                              - 1.5 will be serialized as \"1500m\" - 1.5Gi will be serialized as \"1536Mi\"\
                              \n\nNote that the quantity will NEVER be internally represented by a floating\
                              \ point number. That is the whole point of this exercise.\n\nNon-canonical\
                              \ values will still parse as long as they are well formed, but will be re-emitted\
                              \ in their canonical form. (So always use canonical form, or don't diff.)\n\
                              \nThis format is intended to make it difficult to use these numbers without\
                              \ writing some sort of special handling code in the hopes that that will cause\
                              \ implementors to also use a fixed point implementation."
                            type: "string"
                            properties: { }
                          description: "Requests describes the minimum amount of compute resources required.\
                            \ If Requests is omitted for a container, it defaults to Limits if that is explicitly\
                            \ specified, otherwise to an implementation-defined value. Requests cannot exceed\
                            \ Limits. More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
                          type: "object"
                          properties: { }
                      type: "object"
                    securityContext:
                      description: "SecurityContext holds security configuration that will be applied to\
                        \ a container. Some fields are present in both SecurityContext and PodSecurityContext.\
                        \  When both are set, the values in SecurityContext take precedence."
                      properties:
                        allowPrivilegeEscalation:
                          description: "AllowPrivilegeEscalation controls whether a process can gain more\
                            \ privileges than its parent process. This bool directly controls if the no_new_privs\
                            \ flag will be set on the container process. AllowPrivilegeEscalation is true\
                            \ always when the container is: 1) run as Privileged 2) has CAP_SYS_ADMIN Note\
                            \ that this field cannot be set when spec.os.name is windows."
                          type: "boolean"
                        appArmorProfile:
                          description: "AppArmorProfile defines a pod or container's AppArmor settings."
                          properties:
                            localhostProfile:
                              description: "localhostProfile indicates a profile loaded on the node that\
                                \ should be used. The profile must be preconfigured on the node to work.\
                                \ Must match the loaded name of the profile. Must be set if and only if\
                                \ type is \"Localhost\"."
                              type: "string"
                            type:
                              description: "type indicates which kind of AppArmor profile will be applied.\
                                \ Valid options are:\n  Localhost - a profile pre-loaded on the node.\n\
                                \  RuntimeDefault - the container runtime's default profile.\n  Unconfined\
                                \ - no AppArmor enforcement."
                              type: "string"
                          required:
                            - "type"
                          type: "object"
                          x-kubernetes-unions:
                            - discriminator: "type"
                              fields-to-discriminateBy:
                                localhostProfile: "LocalhostProfile"
                        capabilities:
                          description: "Adds and removes POSIX capabilities from running containers."
                          properties:
                            add:
                              description: "Added capabilities"
                              items:
                                type: "string"
                              type: "array"
                              x-kubernetes-list-type: "atomic"
                            drop:
                              description: "Removed capabilities"
                              items:
                                type: "string"
                              type: "array"
                              x-kubernetes-list-type: "atomic"
                          type: "object"
                        privileged:
                          description: "Run container in privileged mode. Processes in privileged containers\
                            \ are essentially equivalent to root on the host. Defaults to false. Note that\
                            \ this field cannot be set when spec.os.name is windows."
                          type: "boolean"
                        procMount:
                          description: "procMount denotes the type of proc mount to use for the containers.\
                            \ The default value is Default which uses the container runtime defaults for\
                            \ readonly paths and masked paths. This requires the ProcMountType feature flag\
                            \ to be enabled. Note that this field cannot be set when spec.os.name is windows."
                          type: "string"
                        readOnlyRootFilesystem:
                          description: "Whether this container has a read-only root filesystem. Default\
                            \ is false. Note that this field cannot be set when spec.os.name is windows."
                          type: "boolean"
                        runAsGroup:
                          description: "The GID to run the entrypoint of the container process. Uses runtime\
                            \ default if unset. May also be set in PodSecurityContext.  If set in both SecurityContext\
                            \ and PodSecurityContext, the value specified in SecurityContext takes precedence.\
                            \ Note that this field cannot be set when spec.os.name is windows."
                          format: "int64"
                          type: "integer"
                        runAsNonRoot:
                          description: "Indicates that the container must run as a non-root user. If true,\
                            \ the Kubelet will validate the image at runtime to ensure that it does not\
                            \ run as UID 0 (root) and fail to start the container if it does. If unset or\
                            \ false, no such validation will be performed. May also be set in PodSecurityContext.\
                            \  If set in both SecurityContext and PodSecurityContext, the value specified\
                            \ in SecurityContext takes precedence."
                          type: "boolean"
                        runAsUser:
                          description: "The UID to run the entrypoint of the container process. Defaults\
                            \ to user specified in image metadata if unspecified. May also be set in PodSecurityContext.\
                            \  If set in both SecurityContext and PodSecurityContext, the value specified\
                            \ in SecurityContext takes precedence. Note that this field cannot be set when\
                            \ spec.os.name is windows."
                          format: "int64"
                          type: "integer"
                        seLinuxOptions:
                          description: "SELinuxOptions are the labels to be applied to the container"
                          properties:
                            level:
                              description: "Level is SELinux level label that applies to the container."
                              type: "string"
                            role:
                              description: "Role is a SELinux role label that applies to the container."
                              type: "string"
                            type:
                              description: "Type is a SELinux type label that applies to the container."
                              type: "string"
                            user:
                              description: "User is a SELinux user label that applies to the container."
                              type: "string"
                          type: "object"
                        seccompProfile:
                          description: "SeccompProfile defines a pod/container's seccomp profile settings.\
                            \ Only one profile source may be set."
                          properties:
                            localhostProfile:
                              description: "localhostProfile indicates a profile defined in a file on the\
                                \ node should be used. The profile must be preconfigured on the node to\
                                \ work. Must be a descending path, relative to the kubelet's configured\
                                \ seccomp profile location. Must be set if type is \"Localhost\". Must NOT\
                                \ be set for any other type."
                              type: "string"
                            type:
                              description: "type indicates which kind of seccomp profile will be applied.\
                                \ Valid options are:\n\nLocalhost - a profile defined in a file on the node\
                                \ should be used. RuntimeDefault - the container runtime default profile\
                                \ should be used. Unconfined - no profile should be applied."
                              type: "string"
                          required:
                            - "type"
                          type: "object"
                          x-kubernetes-unions:
                            - discriminator: "type"
                              fields-to-discriminateBy:
                                localhostProfile: "LocalhostProfile"
                        windowsOptions:
                          description: "WindowsSecurityContextOptions contain Windows-specific options and\
                            \ credentials."
                          properties:
                            gmsaCredentialSpec:
                              description: "GMSACredentialSpec is where the GMSA admission webhook (https://github.com/kubernetes-sigs/windows-gmsa)\
                                \ inlines the contents of the GMSA credential spec named by the GMSACredentialSpecName\
                                \ field."
                              type: "string"
                            gmsaCredentialSpecName:
                              description: "GMSACredentialSpecName is the name of the GMSA credential spec\
                                \ to use."
                              type: "string"
                            hostProcess:
                              description: "HostProcess determines if a container should be run as a 'Host\
                                \ Process' container. All of a Pod's containers must have the same effective\
                                \ HostProcess value (it is not allowed to have a mix of HostProcess containers\
                                \ and non-HostProcess containers). In addition, if HostProcess is true then\
                                \ HostNetwork must also be set to true."
                              type: "boolean"
                            runAsUserName:
                              description: "The UserName in Windows to run the entrypoint of the container\
                                \ process. Defaults to the user specified in image metadata if unspecified.\
                                \ May also be set in PodSecurityContext. If set in both SecurityContext\
                                \ and PodSecurityContext, the value specified in SecurityContext takes precedence."
                              type: "string"
                          type: "object"
                      type: "object"
                  required:
                    - image
                    - className
                    - jarPath
                savepoint:
                  description: A Flink job savepoint specification.
                  type: object
                  nullable: false
                  properties:
                    savepointMode:
                      description: Control savepoints. Default value is Automatic.
                      type: string
                      enum:
                        - Manual
                        - Automatic
                    savepointPath:
                      description: Path of latest savepoint.
                      type: string
                    savepointInterval:
                      description: Interval between savepoints.
                      type: integer
                      nullable: false
                    savepointTargetPath:
                      description: Location where to create savepoints.
                      type: string
                      nullable: false
                  required:
                    - savepointInterval
                    - savepointTargetPath
                restart:
                  description: A Flink job restart specification.
                  type: object
                  nullable: false
                  properties:
                    restartPolicy:
                      description: Control restart policy. Default value is Never.
                      type: string
                      enum:
                        - Never
                        - Always
                        - OnlyIfFailed
                    restartDelay:
                      description: Delay before automatic restart. Default is 60 seconds.
                      type: integer
                    restartTimeout:
                      description: Timeout for restarting a job. Default is 180 seconds.
                      type: integer
              required:
                - bootstrap
                - savepoint
                - restart
            status:
              type: object
              properties:
                resourceStatus:
                  type: string
                  enum:
                    - Unknown
                    - Updating
                    - Updated
                supervisorStatus:
                  type: string
                  enum:
                    - Unknown
                    - Starting
                    - Started
                    - Stopping
                    - Stopped
                    - Terminated
                clusterName:
                  type: string
                clusterUid:
                  type: string
                clusterHealth:
                  type: string
                labelSelector:
                  type: string
                jobParallelism:
                  type: integer
                jobId:
                  type: string
                jobStatus:
                  type: string
                savepointPath:
                  type: string
                savepointJobId:
                  type: string
                savepointTriggerId:
                  type: string
                savepointTimestamp:
                  type: string
                savepointRequestTimestamp:
                  type: string
                savepointMode:
                  type: string
                restartPolicy:
                  type: string
                digest:
                  type: object
                  properties:
                    bootstrap:
                      type: string
                    savepoint:
                      type: string
                    restart:
                      type: string
                timestamp:
                  type: string
          required:
            - spec
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.jobParallelism
          statusReplicasPath: .status.jobParallelism
          labelSelectorPath: .status.labelSelector
      additionalPrinterColumns:
      - name: RESOURCE-STATUS
        type: string
        jsonPath: .status.resourceStatus
      - name: SUPERVISOR-STATUS
        type: string
        jsonPath: .status.supervisorStatus
      - name: CLUSTER-NAME
        type: string
        jsonPath: .status.clusterName
      - name: CLUSTER-HEALTH
        type: string
        jsonPath: .status.clusterHealth
      - name: JOB-STATUS
        type: string
        jsonPath: .status.jobStatus
      - name: JOB-ID
        type: string
        jsonPath: .status.jobId
      - name: JOB-RESTART
        type: string
        jsonPath: .status.restartPolicy
      - name: JOB-PARALLELISM
        type: integer
        jsonPath: .status.jobParallelism
      - name: REQUESTED-JOB-PARALLELISM
        type: integer
        jsonPath: .spec.jobParallelism
      - name: SAVEPOINT-MODE
        type: string
        jsonPath: .status.savepointMode
      - name: SAVEPOINT-PATH
        type: string
        jsonPath: .status.savepointPath
      - name: SAVEPOINT-AGE
        type: date
        jsonPath: .status.savepointTimestamp
      - name: AGE
        type: date
        jsonPath: .metadata.creationTimestamp
status:
  acceptedNames:
    kind: ''
    plural: ''
  conditions: []
  storedVersions: []
